name: Supabase Migrations

# NEDEN: Bu proje şu ana kadar migration'ları elle (SQL Editor'den) uyguluyordu.
# Bu workflow, main branch'e her push'ta supabase/migrations/ klasöründeki
# henüz uygulanmamış dosyaları otomatik olarak canlı veritabanına uygular.
#
# KURULUM (bir kere yapılması gerekiyor):
# 1. Supabase Dashboard → Account → Access Tokens → yeni bir token oluştur.
# 2. GitHub repo → Settings → Secrets and variables → Actions → şu 3 secret'ı ekle:
#      SUPABASE_ACCESS_TOKEN   → 1. adımda oluşturduğun token
#      SUPABASE_PROJECT_REF    → Supabase proje URL'indeki referans kodu
#                                 (https://xxxxxxxx.supabase.co adresindeki "xxxxxxxx")
#      SUPABASE_DB_PASSWORD    → Supabase Dashboard → Settings → Database
#                                 sayfasındaki veritabanı şifresi
# 3. Bu dosyayı .github/workflows/ altına koyup main'e push'ladığında
#    otomatik çalışmaya başlar.
#
# ONARIM MODU (repair): Eğer bazı migration'lar daha önce ELLE (SQL Editor'den)
# uygulandıysa, Supabase CLI'nin bundan haberi olmaz ve o migration'ları tekrar
# çalıştırmaya çalışıp "relation already exists" hatası verir. Bunu düzeltmek için:
# Actions → Supabase Migrations → "Run workflow" → "repair_versions" alanına,
# zaten elle uygulanmış migration dosyalarının numara önekini virgülle ayırarak
# yazın (örn: 001,002,003,004) → çalıştırın. Bu SADECE CLI'nin takip defterini
# günceller, SQL'i tekrar ÇALIŞTIRMAZ — veriye dokunmaz. Sonraki normal push'larda
# (repair_versions boş) sadece gerçekten yeni migration'lar uygulanır.
#
# NOT: Bu workflow SADECE veritabanı şemasını günceller — Next.js uygulamasının
# kendisini deploy etmez (o iş hâlâ Vercel'in otomatik deploy'unda).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      repair_versions:
        description: 'Sadece onarım için: elle uygulanmış migration numaraları, virgülle ayrılmış (örn: 001,002,003,004). Boş bırakırsanız normal migration push çalışır.'
        required: false
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Repair migration history (sadece elle tetiklenip repair_versions doldurulduğunda)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repair_versions != '' }}
        run: |
          IFS=',' read -ra VERSIONS <<< "${{ github.event.inputs.repair_versions }}"
          for v in "${VERSIONS[@]}"; do
            echo "Onarılıyor: $v → applied olarak işaretleniyor"
            supabase migration repair --status applied "$v"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        # NOT: `supabase db push` bazı CLI sürümlerinde CI'da (terminal
        # olmadığı için) bir onay istemi bekleyip başarısız olabiliyor
        # (bilinen bir sorun: supabase/cli#2238). `yes |` ile bu onayı
        # önden veriyoruz. --debug, hata durumunda log'da gerçek sebebi
        # görebilmek için.
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.repair_versions != '') }}
        run: yes | supabase db push --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}